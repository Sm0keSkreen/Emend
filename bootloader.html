<!doctype html>
<!--
  Emend bootloader, paste into any HTML-accepting box to get a live copy.

  Works around two jsDelivr quirks:
  1. jsDelivr serves .html files from GitHub as text/plain, so an iframe
     with src="...emendapp.html" would show raw source. Fix: fetch as text,
     then hand to the iframe via srcdoc (renders as real HTML regardless).
  2. The @main branch alias is a mutable cache key, so different edge nodes
     can serve stale versions after a push. Fix: query the GitHub API for
     the current HEAD SHA and build a commit-pinned jsDelivr URL. Falls
     back to @main if the API call fails.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emend</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f14; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #boot-status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9fb3c8; font: 14px system-ui, -apple-system, sans-serif; background: #0b0f14;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="boot-status">Loading Emend…</div>
<script>
(function () {
  var REPO = 'Sm0keSkreen/Emend';
  var FILE = 'emendapp.html';
  var FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + FILE;
  var statusEl = document.getElementById('boot-status');

  function renderApp(html) {
    var iframe = document.createElement('iframe');
    iframe.title = 'Emend , offline spelling & grammar checker';
    iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
    iframe.srcdoc = html;
    document.body.innerHTML = '';
    document.body.appendChild(iframe);
  }

  function loadFrom(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + url);
      return res.text();
    });
  }

  // Resolve current HEAD so we use an immutable commit-pinned URL (see above).
  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('GitHub API HTTP ' + res.status);
      return res.json();
    })
    .then(function (commit) {
      var sha = commit.sha;
      if (!sha) throw new Error('no sha in GitHub API response');
      var pinnedUrl = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' + FILE;
      return loadFrom(pinnedUrl);
    })
    .catch(function (err) {
      // API unreachable or rate-limited: fall back to @main.
      console.warn('Falling back to @main (could not resolve commit pin):', err);
      return loadFrom(FALLBACK_URL);
    })
    .then(renderApp)
    .catch(function (err) {
      statusEl.textContent = 'Failed to load Emend: ' + err.message +
        '\n\nDirect link: ' + FALLBACK_URL;
    });
})();
</script>
</body>
</html>
