<!doctype html>
<!--
  Emend bootloader
  -----------------
  Paste this wherever you need a live copy of Emend (any HTML-accepting
  box: an online previewer, a CodePen, a wiki embed, whatever).

  Two jsDelivr quirks this file works around:

  1. jsDelivr serves .html files from GitHub with a `text/plain`
     content-type (a known, long-standing quirk of their Cloudflare-fronted
     infra, not something fixable from the repo side), so a plain
     `src="...emendapp.html"` iframe would show raw source text instead of
     rendering it. Fix: fetch the file as text (fetch() doesn't care about
     Content-Type, only how you choose to consume the response), then hand
     that text to an iframe via `srcdoc` instead of `src`. srcdoc renders
     whatever string you give it as real HTML regardless of how it was
     fetched, which sidesteps the bad header entirely.

  2. jsDelivr's `@main` branch alias is a MUTABLE cache key: different edge
     nodes (Cloudflare vs Fastly, different PoPs) can serve different cached
     versions of the file for a while after a push, even after explicitly
     purging (https://www.jsdelivr.com/tools/purge) -- confirmed live: three
     different edge nodes served three different file sizes for the same
     `@main` URL, minutes after a purge reported "finished". A jsDelivr URL
     pinned to an exact commit SHA is immutable and doesn't have this
     problem -- every edge that has ever fetched that exact SHA's file
     serves the exact same bytes, forever, with no ambiguity. So on every
     load this file first asks GitHub's API for the current HEAD commit of
     main, then builds a commit-pinned jsDelivr URL from that -- always the
     true latest content, never a stale or split-brained edge cache. If the
     API call fails for any reason (offline, rate-limited), it falls back to
     the plain @main URL rather than failing outright.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emend</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f14; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #boot-status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9fb3c8; font: 14px system-ui, -apple-system, sans-serif; background: #0b0f14;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="boot-status">Loading Emend…</div>
<script>
(function () {
  var REPO = 'Sm0keSkreen/Emend';
  var FILE = 'emendapp.html';
  var FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + FILE;
  var statusEl = document.getElementById('boot-status');

  function renderApp(html) {
    var iframe = document.createElement('iframe');
    iframe.title = 'Emend — offline spelling & grammar checker';
    iframe.setAttribute('allow', 'clipboard-read; clipboard-write');
    // srcdoc renders this string as a real document regardless of the
    // Content-Type the bytes were originally served with.
    iframe.srcdoc = html;
    document.body.innerHTML = '';
    document.body.appendChild(iframe);
  }

  function loadFrom(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + url);
      return res.text();
    });
  }

  // Resolve the current HEAD commit so we can use an immutable, never-stale
  // jsDelivr URL instead of the flaky @main alias (see comment above).
  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('GitHub API HTTP ' + res.status);
      return res.json();
    })
    .then(function (commit) {
      var sha = commit.sha;
      if (!sha) throw new Error('no sha in GitHub API response');
      var pinnedUrl = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' + FILE;
      return loadFrom(pinnedUrl);
    })
    .catch(function (err) {
      // GitHub API unreachable/rate-limited: fall back to the mutable
      // @main URL. Slight risk of a stale edge cache, but better than
      // failing to load at all.
      console.warn('Falling back to @main (could not resolve commit pin):', err);
      return loadFrom(FALLBACK_URL);
    })
    .then(renderApp)
    .catch(function (err) {
      statusEl.textContent = 'Failed to load Emend: ' + err.message +
        '\n\nDirect link: ' + FALLBACK_URL;
    });
})();
</script>
</body>
</html>
