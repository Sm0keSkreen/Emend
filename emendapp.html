:root{
  /* Midnight (default): deep navy, monochrome blue */
  --bg:#080b11;
  --panel:#0d121a;
  --panel-2:#111826;
  --border:#1c2432;
  --text:#dde3ee;
  --text-dim:#78839a;
  --accent:#3e82f7;
  --accent-hover:#2f6fe0;
  --accent-soft:rgba(62,130,247,.14);
  --correctness:#f0555f;
  --clarity:#38bdf8;
  --engagement:#34d399;
  --ai:#a78bfa;
  --radius:8px;
  --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14.5px;
}

/* Nord: the Nord editor palette (nordtheme.com) */
:root[data-theme="nord"]{
  --bg:#2e3440;
  --panel:#333a48;
  --panel-2:#3b4252;
  --border:#4c566a;
  --text:#eceff4;
  --text-dim:#9aa5b8;
  --accent:#5e81ac;
  --accent-hover:#81a1c1;
  --accent-soft:rgba(94,129,172,.2);
  --correctness:#bf616a;
  --clarity:#88c0d0;
  --engagement:#a3be8c;
  --ai:#b48ead;
}

/* Ocean: GitHub Dark inspired */
:root[data-theme="ocean"]{
  --bg:#0d1117;
  --panel:#111823;
  --panel-2:#161d29;
  --border:#21262d;
  --text:#e6edf3;
  --text-dim:#7d8590;
  --accent:#388bfd;
  --accent-hover:#58a6ff;
  --accent-soft:rgba(56,139,253,.15);
  --correctness:#f85149;
  --clarity:#58a6ff;
  --engagement:#3fb950;
  --ai:#bc8cff;
}

/* Sky: light, blue accent */
:root[data-theme="sky"]{
  --bg:#f2f6fc;
  --panel:#ffffff;
  --panel-2:#edf2fa;
  --border:#d7e3f0;
  --text:#12203a;
  --text-dim:#5b6b82;
  --accent:#2f7de9;
  --accent-hover:#1d63c9;
  --accent-soft:rgba(47,125,233,.1);
  --correctness:#dc2626;
  --clarity:#0284c7;
  --engagement:#059669;
  --ai:#7c3aed;
  color-scheme:light;
}

html{color-scheme:dark;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}
#app{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:9px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
  flex-shrink:0;
}
.brand{
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  color:var(--text);
}

.mode-tabs{
  display:flex;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:7px;
  padding:2px;
  gap:2px;
}
.mode-tabs button{
  border:none;
  background:transparent;
  padding:5px 12px;
  font-size:12.5px;
  font-weight:500;
  border-radius:5px;
  cursor:pointer;
  color:var(--text-dim);
  white-space:nowrap;
}
.mode-tabs button.active{background:var(--accent-soft);color:var(--accent);}

select#dialect{
  border:1px solid var(--border);
  border-radius:7px;
  padding:5px 9px;
  font-size:12.5px;
  background:var(--panel-2);
  color:var(--text);
}

.topbar-spacer{flex:1;}

.btn{
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  padding:6px 12px;
  border-radius:7px;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.btn:hover{background:#161c27;border-color:#293140;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn.ai{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.ai:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* AI progress bar: the fill lives *inside* the Check button itself (an
   absolutely-positioned span behind the label) so the model-download and
   generation progress reads as "the button is filling up" rather than
   needing separate layout space. Disabled opacity is skipped while a
   progress fill is active (ai-progress-btn.busy) so the fill stays legible;
   the button is still non-interactive via pointer-events. */
.ai-progress-btn{position:relative;overflow:hidden;}
.ai-progress-btn:disabled{cursor:default;}
.ai-progress-btn.busy:disabled{opacity:1;pointer-events:none;}
.ai-progress-fill{
  position:absolute;
  inset:0;
  width:0%;
  background:rgba(255,255,255,.28);
  transition:width .25s ease-out;
  z-index:0;
}
.ai-progress-label{position:relative;z-index:1;white-space:nowrap;}
.btn.small{padding:4px 9px;font-size:12px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--panel-2);color:var(--text);}

/* ---------- Layout ---------- */
.workspace{
  flex:1;
  min-height:0;
  display:flex;
  gap:14px;
  padding:14px 18px;
  max-width:1500px;
  margin:0 auto;
  width:100%;
}
.editor-panel{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.editor-toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.editor-toolbar .spacer{flex:1;}
.upload-btn{
  border:1px solid var(--border);
  background:var(--panel-2);
  padding:6px 12px;
  border-radius:7px;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  color:var(--text);
}
.upload-btn:hover{background:#161c27;border-color:#293140;}

.editor-wrap{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}
.editor-wrap .layer{
  position:absolute;
  inset:0;
  margin:0;
  padding:18px 20px;
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:break-word;
}
.highlights{
  color:transparent;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.highlights mark{
  background:transparent;
  border-bottom:2px solid currentColor;
  border-radius:1px;
  pointer-events:auto;
  cursor:pointer;
}
.highlights mark.active{background:var(--accent-soft);}
.k-correctness{color:var(--correctness);}
.k-clarity{color:var(--clarity);}
.k-engagement{color:var(--engagement);}
.k-ai{color:var(--ai);}

#editor{
  z-index:2;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  caret-color:var(--accent);
  overflow-y:auto;
}
#editor::placeholder{color:var(--text-dim);}

.statusbar{
  display:flex;
  gap:14px;
  align-items:center;
  padding:7px 12px;
  border-top:1px solid var(--border);
  font-size:12px;
  color:var(--text-dim);
  background:var(--panel-2);
  flex-shrink:0;
}
#engineStatus.busy{color:var(--engagement);}
#engineStatus.err{color:#f0555f;}
.statusbar-spacer{flex:1;}
.stats-group{display:none;align-items:center;gap:14px;}
.stats-group.visible{display:flex;}
#statsToggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* ---------- Suggestions panel ---------- */
.suggestions-panel{
  width:320px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.suggestions-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.suggestions-header b{font-size:13px;font-weight:600;color:var(--text);}
.suggestions-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card{
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px 10px;
  cursor:pointer;
  background:var(--panel-2);
}
.card:hover{border-color:#2b3342;}
.card.active{border-color:var(--accent);}
.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}
.card-cat{
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.03em;
  padding:2px 7px;
  border-radius:4px;
}
.cat-correctness{color:var(--correctness);background:rgba(240,85,95,.12);}
.cat-clarity{color:var(--clarity);background:rgba(56,189,248,.12);}
.cat-engagement{color:var(--engagement);background:rgba(52,211,153,.12);}
.cat-ai{color:var(--ai);background:rgba(167,139,250,.14);}
.card-diff{font-size:13.5px;margin-bottom:6px;line-height:1.5;}
.card-diff .old{color:var(--text-dim);text-decoration:line-through;margin-right:6px;}
.card-diff .new{color:var(--text);font-weight:600;}
.card-msg{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.4;}
.card-actions{display:flex;gap:6px;}

.empty-state{
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  text-align:center;
  color:var(--text-dim);
  font-size:13px;
}
.suggestions-list:empty + .empty-state{display:flex;}

/* ---------- Dropdown panels under top bar buttons ---------- */
.menu-wrap{position:relative;}
.dropdown-panel{
  display:none;
  position:absolute;top:calc(100% + 8px);right:0;z-index:40;
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:12px;
}
.dropdown-panel.open{display:block;}
.dropdown-panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.dropdown-panel .label{font-weight:600;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.settings-panel{width:270px;max-height:80vh;overflow-y:auto;}
.theme-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid var(--border);background:var(--sw-bg);
  box-shadow:inset 0 0 0 8px var(--sw-accent);
}
.theme-swatch.selected{border-color:var(--accent);}
select#fontSelect{
  width:100%;border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  border-radius:6px;padding:6px 8px;font-size:12.5px;
}
.chip{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:5px 11px;border-radius:6px;
  font-size:12px;font-weight:500;cursor:pointer;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.model-option{
  border:1px solid var(--border);border-radius:6px;padding:6px 10px;
  cursor:pointer;display:flex;flex-direction:column;background:var(--panel-2);flex:1;min-width:0;
}
.model-option.selected{border-color:var(--accent);}
.model-option .name{font-weight:600;font-size:12px;color:var(--text);}
.model-option .meta{font-size:10.5px;color:var(--text-dim);}

@media (max-width: 860px){
  .workspace{flex-direction:column;}
  .suggestions-panel{width:100%;order:-1;max-height:220px;}
}

          <option value="serif">Serif</option>
          <option value="mono">Monospace</option>
          <option value="system">System default</option>
        </select>
        <div class="label">AI model</div>
        <div class="row" id="aiModelList"></div>
        <div class="label">AI mode</div>
        <div class="row" id="aiToneRow"></div>

      </div>
      <div class="statusbar">
        <span id="engineStatus">Loading…</span>
        <div class="statusbar-spacer"></div>
        <div class="stats-group" id="statsGroup">

          <span id="readability"></span>
        </div>
        <button class="btn ghost small" id="statsToggle">Stats</button>
      </div>

    <aside class="suggestions-panel">

  let debounceTimer = null;
  function scheduleLint(delay = 450) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runLint, delay);
  }

  function setStatus(kind, extra) {
    engineStatus.classList.toggle('busy', kind === 'checking' || kind === 'loading');
    engineStatus.classList.toggle('err', kind === 'error');
    if (kind === 'loading') engineStatus.textContent = 'Loading…';
    else if (kind === 'checking') engineStatus.textContent = 'Checking…';
    else if (kind === 'ready') engineStatus.textContent = 'Ready';
    else if (kind === 'error') engineStatus.textContent = 'Error: ' + extra;
  }

  /* ------------------------------ Stats ------------------------------------ */

  function countSyllables(word) {
    word = word.toLowerCase().replace(/[^a-z]/g, '');
    if (!word) return 0;
    const matches = word.match(/[aeiouy]+/g);
    let count = matches ? matches.length : 1;
    if (word.endsWith('e') && count > 1) count -= 1;
    return Math.max(count, 1);
  }

  function updateStats() {
    const text = editor.value;
    const words = (text.match(/[A-Za-z0-9'â€™_-]+/g) || []);
    const sentences = (text.match(/[^.!?]+[.!?]+/g) || (text.trim() ? [text] : []));
    const wordCount = words.length;
    const readMins = Math.max(1, Math.round(wordCount / 200));
    wordCountEl.textContent = `${wordCount} word${wordCount === 1 ? '' : 's'}, ${text.length} chars, ~${readMins} min read`;

    if (wordCount < 3) { readabilityEl.textContent = ''; return; }
    const syll = words.reduce((s, w) => s + countSyllables(w), 0);
    const sc = Math.max(sentences.length, 1);
    const flesch = 206.835 - 1.015 * (wordCount / sc) - 84.6 * (syll / wordCount);
    let label = 'Very difficult';
    if (flesch >= 90) label = 'Very easy';
    else if (flesch >= 70) label = 'Easy';
    else if (flesch >= 60) label = 'Fairly easy';
    else if (flesch >= 50) label = 'Standard';
    else if (flesch >= 30) label = 'Fairly difficult';
    else if (flesch >= 0) label = 'Difficult';
    readabilityEl.textContent = `${label}, score ${Math.round(Math.max(0, Math.min(100, flesch)))}`;
  }

  /* ------------------------------ Editor sync ------------------------------- */
  // The editor fills its panel at a fixed height and scrolls internally;
  // the highlight layer just mirrors that scroll offset via transform.

  editor.addEventListener('input', () => {
    // Any edit invalidates the last AI Check immediately — don't wait for
    // the debounced Harper re-lint to (eventually) drop stale AI cards.
    if (state.aiChecked || state.lints.some((l) => l.kind === 'AI')) {
      state.lints = state.lints.filter((l) => l.kind !== 'AI');
      state.aiChecked = false;
    }
    renderHighlights();
    renderSuggestions();
    scheduleLint();
  });
  editor.addEventListener('scroll', () => {
    highlights.style.transform = `translateY(${-editor.scrollTop}px)`;
  });

  highlights.addEventListener('click', (e) => {
    const mark = e.target.closest('mark');
    if (mark) selectLint(Number(mark.dataset.id));
  });

  /* ------------------------------ Toolbar ------------------------------------ */

  modeTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    state.mode = btn.dataset.mode;
    [...modeTabs.children].forEach((b) => b.classList.toggle('active', b === btn));
    renderHighlights();
    renderSuggestions();
  });

  dialectSelect.addEventListener('change', async () => {
    await engine.setDialect(dialectSelect.value);
    state.aiChecked = false; // different rules can change what's flagged; keep AI results in sync
    await runLint();
  });

  acceptAllBtn.addEventListener('click', acceptAll);

  statsToggle.addEventListener('click', () => {
    const on = statsGroup.classList.toggle('visible');
    statsToggle.classList.toggle('active', on);
  });

  clearBtn.addEventListener('click', () => {
    editor.value = '';
    state.lints = [];
    state.aiChecked = false;
    renderHighlights();
    renderSuggestions();
    updateStats();
    editor.focus();
  });

  const SAMPLE = `Their are many reasons why this happen, and its important to understand them. Me and him was going to the store yesterday, and we seen alot of thing's that dont make no sense to nobody. Irregardless of the fact that it effects everyone, people often loose focus on whats truly important. This is a very unique and very important oppurtunity for us to improve are writing skills.`;
  sampleBtn.addEventListener('click', () => {
    editor.value = SAMPLE;
    state.lints = state.lints.filter((l) => l.kind !== 'AI');
    state.aiChecked = false;
    renderHighlights();
    renderSuggestions();
    scheduleLint(0);
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  uploadInput.addEventListener('change', async () => {
    const file = uploadInput.files[0];
    if (!file) return;
    const text = await file.text();
    editor.value = text;
    state.lints = state.lints.filter((l) => l.kind !== 'AI');
    state.aiChecked = false;
    renderHighlights();
    renderSuggestions();
    scheduleLint(0);
    uploadInput.value = '';
  });

  /* ------------------------------ Settings ------------------------------------- */

  const THEMES = [
    { id: 'midnight', label: 'Midnight', bg: '#080b11', accent: '#3e82f7' },
    { id: 'nord', label: 'Nord', bg: '#2e3440', accent: '#5e81ac' },
    { id: 'ocean', label: 'Ocean', bg: '#0d1117', accent: '#388bfd' },
    { id: 'sky', label: 'Sky', bg: '#f2f6fc', accent: '#2f7de9' },
  ];
  const FONT_STACKS = {
    ui: '"Inter","Segoe UI",system-ui,-apple-system,sans-serif',
    'open-sans': '"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif',
    serif: '"Iowan Old Style","Georgia","Times New Roman",serif',
    mono: 'ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace',
    system: 'system-ui,-apple-system,"Segoe UI",sans-serif',
  };

  function renderThemes() {
    themeRow.innerHTML = '';
    const current = document.documentElement.dataset.theme || 'midnight';
    THEMES.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'theme-swatch' + (t.id === current ? ' selected' : '');
      btn.title = t.label;
      btn.style.setProperty('--sw-bg', t.bg);
      btn.style.setProperty('--sw-accent', t.accent);
      btn.addEventListener('click', () => {
        document.documentElement.dataset.theme = t.id;
        renderThemes();
      });
      themeRow.appendChild(btn);
    });
  }
  renderThemes();

  fontSelect.addEventListener('change', () => {
    document.documentElement.style.setProperty('--font-ui', FONT_STACKS[fontSelect.value] || FONT_STACKS.ui);
  });

  settingsToggleBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    // Use composedPath() rather than settingsWrap.contains(e.target): a click
    // on a theme swatch rebuilds themeRow's innerHTML synchronously (see
    // renderThemes), which detaches the clicked button from the document
    // before this listener runs. contains() would then see a disconnected
    // node and wrongly treat the click as "outside", closing the panel
    // immediately after every theme pick. composedPath() is captured at
    // dispatch time, before any of that mutation happens.
    if (settingsPanel.classList.contains('open') && !e.composedPath().includes(settingsWrap)) {
      settingsPanel.classList.remove('open');
    }
  });

  /* ------------------------------ AI Check ------------------------------------- */
  // Called by ai.js once the model has produced a corrected version of the
  // text. Diffs it against what was actually sent (which may be just a
  // selection, hence baseOffset) and merges the changed spans in as lint
  // cards indistinguishable in behavior from Harper's own.
  let aiHunkSeq = 0;
  function applyAiHunks(originalSlice, correctedText, baseOffset) {
    const hunks = buildAiHunks(originalSlice, correctedText);
    state.lints = state.lints.filter((l) => l.kind !== 'AI');
    if (hunks) {
      // The AI pass rewrites the whole slice from scratch, so it routinely
      // "rediscovers" fixes Harper already caught (a typo, a grammar slip)
      // on top of whatever it's actually adding. Showing both as separate
      // cards for the same span is just clutter, not extra value — so skip
      // an AI hunk when an existing (non-AI) lint already covers that span
      // with the exact same replacement text.
      const harperLints = state.lints;
      for (const h of hunks) {
        const start = h.start + baseOffset;
        const end = h.end + baseOffset;
        const newNorm = h.newText.trim().toLowerCase();
        const dupesHarper = harperLints.some((l) => l.start <= end && l.end >= start
          && l.suggestions.some((s) => s.trim().toLowerCase() === newNorm));
        if (dupesHarper) continue;
        aiHunkSeq += 1;
        state.lints.push({
          id: 1e6 + aiHunkSeq, // well clear of Harper's own small per-lint ids
          start,
          end,
          problemText: h.oldText,
          kind: 'AI',
          kindPretty: 'AI',
          message: 'AI-suggested correction.',
          suggestions: [h.newText],
          _raw: { lint: null, suggestions: [null] },
        });
      }
      state.lints.sort((a, b) => a.start - b.start);
    }
    state.aiChecked = true;
    renderHighlights();
    renderSuggestions();
  }

  /* ------------------------------ Boot ---------------------------------------- */

  async function boot() {
    setStatus('loading');
    try {
      await engine.setup();
      state.engineReady = true;
      setStatus('ready');
      updateStats();
    } catch (err) {
      console.error(err);
      setStatus('error', String(err && err.message || err));
    }
  }
  boot();

  /* expose for the AI module + debugging */
  window.__app = { state, editor, runLint, engine, applyAiHunks };
})();

<script>
/* AI Check: an optional local-model pass that looks for the same kind of
   errors a rule-based checker misses (wrong word for context, subtler
   agreement/tense issues) plus a few stylistic modes, and reports them the
   same way Harper's own checks do — as accept/dismiss cards in the
   suggestions list. The model downloads automatically in the background as
   soon as the page loads (no extra step to opt in), and everything runs
   on-device; nothing leaves the browser.

   Model loading and text generation both run inside a dedicated Web Worker
   (see WORKER_SRC below) rather than on the main thread. transformers.js's
   WASM backend does real, synchronous-feeling heavy lifting for both steps;
   run in-page, that freezes the UI (the editor stops responding, buttons
   don't visually update) for as long as it takes. Moving it into a worker
   keeps the page interactive throughout, and lets the main thread show live
   progress instead of guessing whether it's still working. */
(() => {
  'use strict';

  const TRANSFORMERS_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

  const MODELS = {
    fast: { id: 'onnx-community/Qwen2.5-0.5B-Instruct', label: 'Fast', meta: '400MB', dtype: 'q4' },
    better: { id: 'HuggingFaceTB/SmolLM2-1.7B-Instruct', label: 'Better', meta: '1.1GB, higher quality', dtype: 'q4f16' },
  };

  const TONES = [
    { id: 'deepfix', label: 'Deep Fix', instruction: 'Carefully proofread the text and fix every grammar, spelling, punctuation, capitalization, and word-choice error you can find, using the full context of the passage to catch mistakes a simple rule-based spellchecker would miss (wrong word for the context, subtle subject-verb agreement, tense consistency across sentences, and so on). This is a correction pass, not a rewrite: keep the original wording, sentence structure, and meaning as close to the source as possible, and only change what is actually wrong.' },
    { id: 'formal', label: 'Formal', instruction: 'Rewrite the text to sound more formal and professional, preserving its full meaning.' },
    { id: 'casual', label: 'Casual', instruction: 'Rewrite the text in a relaxed, casual, conversational tone, preserving its full meaning.' },
    { id: 'concise', label: 'Concise', instruction: 'Rewrite the text to be as concise and clear as possible without losing meaning.' },
    { id: 'fluent', label: 'Fluent', instruction: 'Rewrite the text so it reads naturally and fluently, fixing any awkward phrasing.' },
    { id: 'expand', label: 'Expand', instruction: 'Expand the text with more detail and supporting explanation, keeping the same voice.' },
    { id: 'simplify', label: 'Simplify', instruction: 'Simplify the text into plain, easy to understand language.' },
  ];

  const MAX_CHECK_LENGTH = 20000;

  const $ = (s) => document.querySelector(s);
  const modelList = $('#aiModelList');
  const toneRow = $('#aiToneRow');
  const checkBtn = $('#checkBtn');
  const aiProgressFill = $('#aiProgressFill');
  const aiProgressLabel = $('#aiProgressLabel');

  // Remembers, for this browser tab only, that Better failed to load once
  // and we should go straight to Fast on future page loads without
  // retrying it. (Belt-and-suspenders: the in-memory state.betterUnavailable
  // flag below is what actually drives this session's behavior; this just
  // carries the same decision across a manual page refresh.)
  const SKIP_BETTER_KEY = 'emend-ai-skip-better';
  let skipBetter = false;
  try { skipBetter = sessionStorage.getItem(SKIP_BETTER_KEY) === '1'; } catch { /* storage unavailable; ignore */ }

  const state = {
    modelKey: skipBetter ? 'fast' : 'better',
    tone: 'deepfix',
    pipelinesReady: {},    // modelKey -> true once loaded in the current worker
    loadPromises: {},      // modelKey -> in-flight load promise, so concurrent callers share one download
    loading: null,         // modelKey currently downloading, or null
    loadingPct: null,
    loadStartedAt: null,   // Date.now() when the current download began, for ETA math
    loadError: null,       // modelKey that most recently failed to load (and isn't the better->fast handoff)
    checking: false,
    checkStartedAt: null,  // Date.now() when the current generation began, for ETA math
    genTokens: 0,
    genMaxTokens: 0,
    betterUnavailable: skipBetter, // set once Better is confirmed to fail on this device
  };

  /* --------------------------- Worker plumbing --------------------------- */
  // Everything transformers.js-related (model download, session creation,
  // token generation) happens inside this worker's own thread. The main
  // thread only ever exchanges small JSON messages with it.
  const WORKER_SRC = `
    let transformersMod = null;
    const pipelines = {};
    let devicePromise = null;

    async function pickDevice() {
      if (!('gpu' in self.navigator)) return 'wasm';
      try {
        const adapter = await self.navigator.gpu.requestAdapter();
        return adapter ? 'webgpu' : 'wasm';
      } catch {
        return 'wasm';
      }
    }

    async function loadPipeline(modelId, dtype, device, onProgress) {
      if (!transformersMod) {
        transformersMod = await import(${JSON.stringify(TRANSFORMERS_CDN)});
        // See the matching comment in the old main-thread version of this
        // file: forcing single-threaded WASM avoids onnxruntime-web sizing
        // its memory arena for a cross-origin-isolated thread count that
        // isn't actually available, which otherwise fails the very first
        // allocation on machines with plenty of free RAM.
        transformersMod.env.backends.onnx.wasm.numThreads = 1;
      }
      return transformersMod.pipeline('text-generation', modelId, {
        dtype, device, progress_callback: onProgress,
      });
    }

    self.onmessage = async (e) => {
      const msg = e.data;
      if (msg.type === 'loadModel') {
        const { key, modelId, dtype } = msg;
        try {
          if (!devicePromise) devicePromise = pickDevice();
          let device = await devicePromise;
          const files = {};
          const onProgress = (p) => {
            if (p.status === 'progress' && p.file) {
              files[p.file] = p;
              let loaded = 0, total = 0;
              for (const f of Object.values(files)) { loaded += f.loaded || 0; total += f.total || 0; }
              self.postMessage({ type: 'loadProgress', key, pct: total ? Math.round((loaded / total) * 100) : 0 });
            }
          };
          let generator;
          try {
            generator = await loadPipeline(modelId, dtype, device, onProgress);
          } catch (err) {
            if (device !== 'wasm') {
              device = 'wasm';
              generator = await loadPipeline(modelId, dtype, 'wasm', onProgress);
            } else {
              throw err;
            }
          }
          pipelines[key] = generator;
          self.postMessage({ type: 'loadDone', key });
        } catch (err) {
          self.postMessage({ type: 'loadError', key, message: String((err && err.message) || err) });
        }
      } else if (msg.type === 'generate') {
        const { reqId, key, messages, genOpts } = msg;
        try {
          const pipe = pipelines[key];
          if (!pipe) throw new Error('model not loaded: ' + key);
          const streamer = new transformersMod.TextStreamer(pipe.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (chunk) => {
              self.postMessage({ type: 'genProgress', reqId });
            },
          });
          const result = await pipe(messages, Object.assign({}, genOpts, { streamer }));
          let text = result && result[0] && result[0].generated_text;
          if (Array.isArray(text)) text = (text[text.length - 1] && text[text.length - 1].content) || '';
          self.postMessage({ type: 'genDone', reqId, text });
        } catch (err) {
          self.postMessage({ type: 'genError', reqId, message: String((err && err.message) || err) });
        }
      }
    };
  `;

  let worker = null;
  let workerReqSeq = 0;
  const pendingGen = new Map(); // reqId -> { resolve, reject, onProgress }

  function makeWorker() {
    const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url, { type: 'module' });
    URL.revokeObjectURL(url);
    w.onmessage = onWorkerMessage;
    w.onerror = (err) => console.error('AI worker error:', err);
    return w;
  }
  worker = makeWorker();

  function onWorkerMessage(e) {
    const msg = e.data;
    if (msg.type === 'loadProgress') {
      if (state.loading === msg.key) { state.loadingPct = msg.pct; updateCheckBtn(); }
    } else if (msg.type === 'loadDone') {
      state.pipelinesReady[msg.key] = true;
      settleLoad(msg.key, null);
    } else if (msg.type === 'loadError') {
      settleLoad(msg.key, msg.message);
    } else if (msg.type === 'genProgress') {
      const p = pendingGen.get(msg.reqId);
      if (p) p.onProgress();
    } else if (msg.type === 'genDone') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.resolve(msg.text); }
    } else if (msg.type === 'genError') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.reject(new Error(msg.message)); }
    }
  }

  const loadResolvers = {}; // key -> { resolve, reject }
  function settleLoad(key, errMessage) {
    const resolver = loadResolvers[key];
    delete loadResolvers[key];
    if (errMessage && key === 'better' && !state.betterUnavailable) {
      // The higher-quality model can fail outright on some devices — its
      // real memory footprint is just bigger than what's available there.
      // A failed allocation leaves onnxruntime-web's WASM memory maxed out
      // (WebAssembly.Memory can grow but never shrink), so retrying Fast in
      // that SAME worker would fail identically even though Fast loads fine
      // on its own. Ditch the poisoned worker for a fresh one instead of
      // reloading the whole page — no lost editor text, no jarring reload.
      console.warn('Better model failed to load; switching to Fast in a fresh worker:', errMessage);
      state.betterUnavailable = true;
      try { sessionStorage.setItem(SKIP_BETTER_KEY, '1'); } catch { /* storage unavailable; ignore */ }
      worker.terminate();
      worker = makeWorker();
      state.modelKey = 'fast';
      // renderModelOptions() marks Better "Unavailable on this device" from
      // here on — that's the durable explanation. A one-off flashCheckBtn()
      // notice isn't used here: whatever caller is awaiting this (the
      // background preload, or doCheck() itself) immediately drives the
      // button into "Loading AI…"/"Checking…" right after, so a flashed
      // message would just get overwritten within a few hundred ms anyway.
      renderModelOptions();
      ensureModel('fast').then(
        () => { if (resolver) resolver.resolve(); },
        (err) => { if (resolver) resolver.reject(err); },
      );
      return;
    }
    if (errMessage) {
      state.loadError = key;
      updateCheckBtn();
      if (resolver) resolver.reject(new Error(errMessage));
    } else if (resolver) {
      resolver.resolve();
    }
  }

  function ensureModel(key) {
    if (state.pipelinesReady[key]) return Promise.resolve();
    if (state.loadPromises[key]) return state.loadPromises[key];
    const m = MODELS[key];
    state.loading = key;
    state.loadingPct = null;
    state.loadStartedAt = Date.now();
    state.loadError = null;
    updateCheckBtn();
    const promise = new Promise((resolve, reject) => { loadResolvers[key] = { resolve, reject }; });
    worker.postMessage({ type: 'loadModel', key, modelId: m.id, dtype: m.dtype });
    const tracked = promise.finally(() => {
      if (state.loading === key) state.loading = null;
      delete state.loadPromises[key];
      updateCheckBtn();
    });
    state.loadPromises[key] = tracked;
    return tracked;
  }

  function runGenerate(key, messages, genOpts, onProgress) {
    return new Promise((resolve, reject) => {
      const reqId = ++workerReqSeq;
      pendingGen.set(reqId, { resolve, reject, onProgress });
      worker.postMessage({ type: 'generate', reqId, key, messages, genOpts });
    });
  }

  /* -------------------------------- UI ------------------------------------ */

  function currentTone() { return TONES.find((t) => t.id === state.tone) || TONES[0]; }

  function renderModelOptions() {
    modelList.innerHTML = '';
    Object.entries(MODELS).forEach(([key, m]) => {
      const unavailable = key === 'better' && state.betterUnavailable;
      const div = document.createElement('div');
      div.className = 'model-option'
        + (state.modelKey === key ? ' selected' : '')
        + (unavailable ? ' unavailable' : '');
      div.innerHTML = `<span class="name">${m.label}</span><span class="meta">${unavailable ? 'Unavailable on this device' : m.meta}</span>`;
      div.addEventListener('click', () => selectModel(key));
      modelList.appendChild(div);
    });
  }

  function renderTones() {
    toneRow.innerHTML = '';
    TONES.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (state.tone === t.id ? ' active' : '');
      btn.textContent = t.label;
      btn.addEventListener('click', () => { state.tone = t.id; renderTones(); });
      toneRow.appendChild(btn);
    });
  }

  function selectModel(key) {
    if (key === 'better' && state.betterUnavailable) {
      flashCheckBtn("Better isn't supported on this device — staying on Fast.");
      return;
    }
    state.modelKey = key;
    renderModelOptions();
    updateCheckBtn();
    if (!state.pipelinesReady[key] && state.loading !== key) ensureModel(key).catch(() => {});
  }

  // Briefly shows a message in place of the Check button's normal label,
  // then reverts — used for one-off notices (a model switch, a length
  // guard) without needing a separate toast/notification UI.
  function flashCheckBtn(message, ms = 2200) {
    setProgressFill(0);
    aiProgressLabel.textContent = message;
    setTimeout(updateCheckBtn, ms);
  }

  function setProgressFill(pct) {
    checkBtn.classList.toggle('busy', pct != null && pct > 0);
    aiProgressFill.style.width = (pct == null ? 0 : Math.max(0, Math.min(100, pct))) + '%';
  }

  // Rough proxy for how many tokens the reply will actually run — used only
  // to size the progress bar's denominator, never sent to the model (the
  // real max_new_tokens cap still governs generation). ~4 characters per
  // token is a common enough English rule of thumb; Deep Fix and the other
  // tones mostly preserve the input's length, but Expand deliberately grows
  // it, so it gets a bigger multiplier. Clamped to the real cap since the
  // model can never exceed it regardless of the estimate.
  function estimateOutputTokens(sourceText, toneId, maxTokens) {
    const approxInputTokens = Math.max(8, Math.ceil(sourceText.length / 4));
    const factor = toneId === 'expand' ? 2.5 : 1.15;
    const est = Math.ceil(approxInputTokens * factor);
    return Math.max(16, Math.min(maxTokens, est));
  }

  // Rough ETA from "how far we've gotten" vs "how long that took": assumes
  // a roughly constant rate from the start of this phase, which is good
  // enough for a download/generation progress readout (not a promise of
  // accuracy) without needing to track a rolling window of samples.
  function estimateEtaSeconds(startedAt, pct) {
    if (!startedAt || pct == null || pct <= 0) return null;
    const elapsedSec = (Date.now() - startedAt) / 1000;
    const ratePerSec = pct / elapsedSec;
    if (!(ratePerSec > 0)) return null;
    return (100 - pct) / ratePerSec;
  }

  function formatEta(seconds) {
    if (seconds == null || !isFinite(seconds) || seconds < 0) return '';
    if (seconds < 1) return 'almost done';
    if (seconds < 60) return `~${Math.round(seconds)}s left`;
    const mins = Math.floor(seconds / 60);
    const secs = Math.round(seconds % 60);
    return `~${mins}m ${secs}s left`;
  }

  function updateCheckBtn() {
    if (state.loading === state.modelKey) {
      checkBtn.disabled = true;
      const pct = state.loadingPct;
      setProgressFill(pct != null ? pct : 0);
      const eta = formatEta(estimateEtaSeconds(state.loadStartedAt, pct));
      aiProgressLabel.textContent = pct != null
        ? `Loading AI ${pct}%${eta ? ' · ' + eta : ''}`
        : 'Loading AI…';
    } else if (state.checking) {
      checkBtn.disabled = true;
      const pct = state.genMaxTokens
        ? Math.min(99, Math.round((state.genTokens / state.genMaxTokens) * 100))
        : null;
      setProgressFill(pct != null ? pct : 0);
      const eta = formatEta(estimateEtaSeconds(state.checkStartedAt, pct));
      aiProgressLabel.textContent = pct != null
        ? `Checking… ${pct}%${eta ? ' · ' + eta : ''}`
        : 'Checking…';
    } else if (state.loadError === state.modelKey && !state.pipelinesReady[state.modelKey]) {
      checkBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Retry AI';
    } else {
      checkBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Check';
    }
  }

  /** The model is told to reply with only the corrected text, but small
   *  instruct models sometimes ignore that and prepend a line like "Here is
   *  the corrected version:" or wrap the answer in quotes/code fences. Left
   *  alone, that stray text doesn't exist in the original, so the diff turns
   *  it into a bogus "insert this phrase" suggestion card that would corrupt
   *  the document if accepted. Strip the common shapes before diffing. */
  function stripPreamble(text) {
    let t = text;
    t = t.replace(/^```[a-z]*\n?/i, '').replace(/```\s*$/, '');
    t = t.replace(/^\s*(here'?s|here is|below is|this is)\s+(the\s+)?(corrected|rewritten|revised|fixed|updated)(\s+(version|text|passage|sentence|paragraph))?\s*:?\s*\n+/i, '');
    t = t.replace(/^(corrected|rewritten|revised|fixed|updated)(\s+(version|text))?\s*:\s*\n+/i, '');
    t = t.trim();
    if (t.length > 1 && ((t[0] === '"' && t[t.length - 1] === '"') || (t[0] === '“' && t[t.length - 1] === '”'))) {
      t = t.slice(1, -1).trim();
    }
    return t;
  }

  async function doCheck() {
    if (checkBtn.disabled) return;
    const editor = window.__app.editor;
    const hasSel = editor.selectionStart !== editor.selectionEnd;
    const baseOffset = hasSel ? editor.selectionStart : 0;
    const source = hasSel ? editor.value.slice(editor.selectionStart, editor.selectionEnd) : editor.value;
    if (!source.trim()) return;
    if (source.length > MAX_CHECK_LENGTH) {
      flashCheckBtn('Text too long', 1600);
      return;
    }
    try {
      await ensureModel(state.modelKey);
    } catch {
      return; // updateCheckBtn() already reflects the failure ("Retry AI")
    }
    const tone = currentTone();
    const isFix = tone.id === 'deepfix';
    const genOpts = isFix
      ? { max_new_tokens: 512, temperature: 0.15, do_sample: false }
      : { max_new_tokens: 512, temperature: 0.7, do_sample: true };
    state.checking = true;
    state.genTokens = 0;
    // The hard cap (max_new_tokens) is a ceiling the model rarely reaches —
    // Deep Fix and most tones stop at an EOS token once the corrected/rewritten
    // text is done, usually close to the input's own length. Sizing the
    // progress bar's denominator off the 512-token cap instead of that
    // realistic length makes the bar (and its ETA) crawl at ~1% for the
    // entire check, then jump straight to done. Estimate the likely output
    // length instead so "N% done" — and the ETA derived from it — tracks
    // where generation actually is.
    state.genMaxTokens = estimateOutputTokens(source, tone.id, genOpts.max_new_tokens);
    state.checkStartedAt = Date.now();
    updateCheckBtn();
    try {
      const messages = [
        { role: 'system', content: 'Reply with only the corrected/rewritten text. No preamble, no quotes, no explanation of what changed.' },
        { role: 'user', content: `${tone.instruction}\n\nTEXT:\n${source}` },
      ];
      // Deep Fix is a correction pass, not creative writing: use low-temperature,
      // near-greedy decoding so it doesn't introduce new wording on top of the
      // actual errors. The stylistic tones keep some sampling for natural variety.
      // state.modelKey may have changed since we started (a failed Better load
      // switches to Fast above), so re-read it now rather than use a stale copy.
      const text = await runGenerate(state.modelKey, messages, genOpts, () => {
        state.genTokens += 1;
        updateCheckBtn();
      });
      const corrected = stripPreamble((text || '').trim());
      if (corrected) window.__app.applyAiHunks(source, corrected, baseOffset);
    } catch (err) {
      console.error(err);
    } finally {
      state.checking = false;
      updateCheckBtn();
    }
  }
  checkBtn.addEventListener('click', doCheck);

  renderModelOptions();
  renderTones();
  updateCheckBtn();
  // "Always there by default": start fetching the model in the background
  // the moment the page loads, so Check is usually instant by the time
  // someone actually clicks it, instead of requiring an explicit load step.
  ensureModel(state.modelKey).catch(() => {});
})();

</script>
</body>
</html>
